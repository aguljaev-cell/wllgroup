name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository files
        shell: pwsh
        run: |
          $required = @(
            'run.py',
            'requirements.txt',
            'PDFMathTranslate_WLL.spec',
            'main.py',
            'model_runtime.py',
            'processors.py',
            'translator.py',
            'worker.py',
            'config.py',
            '__init__.py'
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file is missing: $file"
            }
          }

      - name: Adapt imports to flat repository structure
        shell: pwsh
        run: |
          @'
          from main import main

          if __name__ == "__main__":
              main()
          '@ | Set-Content -Path run.py -Encoding UTF8

          $pythonFiles = @(
            'main.py',
            'model_runtime.py',
            'processors.py',
            'translator.py',
            'worker.py',
            'config.py'
          )

          foreach ($file in $pythonFiles) {
            $content = Get-Content $file -Raw

            $content = $content.Replace('from app.', 'from ')
            $content = $content.Replace('import app.', 'import ')

            $content = $content -replace '(?m)^(\s*)from\s+\.(\w+)\s+import\s+', '$1from $2 import '
            $content = $content -replace '(?m)^(\s*)from\s+\.\s+import\s+(\w+)', '$1import $2'
            $content = $content -replace '(?m)^(\s*)import\s+\.(\w+)', '$1import $2'

            Set-Content -Path $file -Value $content -Encoding UTF8
          }

          $remaining = Select-String -Path *.py -Pattern '^\s*(from|import)\s+\.' -AllMatches
          if ($remaining) {
            $remaining | ForEach-Object { Write-Host $_.Line }
            throw 'Relative imports remain after adaptation'
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Download llama.cpp Vulkan and CPU runtimes
        shell: pwsh
        run: |
          $headers = @{ 'User-Agent' = 'PDFMathTranslate-WLL' }
          $release = Invoke-RestMethod `
            -Headers $headers `
            -Uri 'https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/b10369'

          $vulkan = $release.assets | Where-Object {
            $_.name -match 'bin-win-vulkan-x64\.zip$'
          } | Select-Object -First 1

          $cpu = $release.assets | Where-Object {
            $_.name -match 'bin-win-cpu-x64\.zip$'
          } | Select-Object -First 1

          if (-not $vulkan) {
            throw 'Official llama.cpp Windows Vulkan archive was not found'
          }
          if (-not $cpu) {
            throw 'Official llama.cpp Windows CPU archive was not found'
          }

          New-Item -ItemType Directory -Force `
            vendor/llama/vulkan, vendor/llama/cpu, runtime-temp | Out-Null

          Invoke-WebRequest `
            -Headers $headers `
            -Uri $vulkan.browser_download_url `
            -OutFile runtime-temp/vulkan.zip

          Invoke-WebRequest `
            -Headers $headers `
            -Uri $cpu.browser_download_url `
            -OutFile runtime-temp/cpu.zip

          Expand-Archive runtime-temp/vulkan.zip runtime-temp/vulkan -Force
          Expand-Archive runtime-temp/cpu.zip runtime-temp/cpu -Force

          $vulkanServer = Get-ChildItem runtime-temp/vulkan -Recurse `
            -Filter llama-server.exe | Select-Object -First 1
          $cpuServer = Get-ChildItem runtime-temp/cpu -Recurse `
            -Filter llama-server.exe | Select-Object -First 1

          if (-not $vulkanServer) { throw 'Vulkan llama-server.exe not found' }
          if (-not $cpuServer) { throw 'CPU llama-server.exe not found' }

          Copy-Item "$($vulkanServer.Directory.FullName)\*" `
            vendor/llama/vulkan -Recurse -Force
          Copy-Item "$($cpuServer.Directory.FullName)\*" `
            vendor/llama/cpu -Recurse -Force

          Write-Host "llama.cpp release: $($release.tag_name)"
          Write-Host "Vulkan asset: $($vulkan.name)"
          Write-Host "CPU asset: $($cpu.name)"

      - name: Run syntax checks
        shell: pwsh
        run: |
          python -m compileall -q `
            run.py `
            main.py `
            model_runtime.py `
            processors.py `
            translator.py `
            worker.py `
            config.py

      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            PDFMathTranslate_WLL.spec

      - name: Verify application build
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/PDFMathTranslate_WLL.exe')) {
            throw 'PyInstaller did not create dist/PDFMathTranslate_WLL.exe'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Create installer script
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            build, release |
            Out-Null

          @'
          #define MyAppName "PDFMathTranslate WLL"
          #define MyAppVersion "0.5.3"
          #define MyAppPublisher "WorldLogicLine"
          #define MyAppExeName "PDFMathTranslate_WLL.exe"

          [Setup]
          AppId={{2D469E4A-D4A6-40F8-9DAB-4B54FBC0BE31}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={localappdata}\Programs\PDFMathTranslate WLL
          DefaultGroupName={#MyAppName}
          OutputDir=..\release
          OutputBaseFilename=PDFMathTranslate_WLL_Setup_v0_5_3
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Files]
          Source: "..\dist\PDFMathTranslate_WLL.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Tasks]
          Name: "desktopicon"; Description: "Создать ярлык на рабочем столе"; GroupDescription: "Дополнительные значки:"

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Запустить {#MyAppName}"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content `
            -Path build/installer.iss `
            -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            build\installer.iss

      - name: Create checksums
        shell: pwsh
        run: |
          $file = Get-Item `
            release/PDFMathTranslate_WLL_Setup_v0_5_3.exe

          $hash = (
            Get-FileHash `
              $file.FullName `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  $($file.Name)" |
            Out-File `
              release/SHA256SUMS.txt `
              -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDFMathTranslate_WLL_Windows_v0_5_3
          path: |
            release/PDFMathTranslate_WLL_Setup_v0_5_3.exe
            release/SHA256SUMS.txt
          retention-days: 14
