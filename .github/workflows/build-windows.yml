name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify repository files
        shell: pwsh
        run: |
          $required = @(
            'run.py',
            'requirements.txt',
            'PDFMathTranslate_WLL.spec',
            'app/main.py',
            'app/model_runtime.py',
            'app/processors.py',
            'app/translator.py',
            'app/worker.py'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required file is missing: $file" }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build llama.cpp runtime
        shell: pwsh
        run: |
          git clone --depth 1 --branch b6031 https://github.com/ggerganov/llama.cpp.git llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --config Release --target llama-server -j 2
          New-Item -ItemType Directory -Force vendor/llama | Out-Null
          $server = Get-ChildItem llama.cpp/build -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $server) { throw 'llama-server.exe not found' }
          Copy-Item $server.FullName vendor/llama/llama-server.exe -Force
          Get-ChildItem $server.Directory.FullName -Filter '*.dll' | Copy-Item -Destination vendor/llama -Force

      - name: Run syntax checks
        shell: pwsh
        run: python -m compileall -q app run.py

      - name: Build application
        shell: pwsh
        run: pyinstaller --noconfirm --clean PDFMathTranslate_WLL.spec

      - name: Verify application build
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/PDFMathTranslate_WLL.exe')) {
            throw 'PyInstaller did not create dist/PDFMathTranslate_WLL.exe'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create installer script
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build, release | Out-Null
          @'
          #define MyAppName "PDFMathTranslate WLL"
          #define MyAppVersion "0.3.1"
          #define MyAppPublisher "WorldLogicLine"
          #define MyAppExeName "PDFMathTranslate_WLL.exe"

          [Setup]
          AppId={{2D469E4A-D4A6-40F8-9DAB-4B54FBC0BE31}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher={#MyAppPublisher}
          DefaultDirName={localappdata}\Programs\PDFMathTranslate WLL
          DefaultGroupName={#MyAppName}
          OutputDir=..\release
          OutputBaseFilename=PDFMathTranslate_WLL_Setup_v0_3_1
          Compression=lzma2/ultra64
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible
          PrivilegesRequired=lowest
          UninstallDisplayIcon={app}\{#MyAppExeName}

          [Files]
          Source: "..\dist\PDFMathTranslate_WLL.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Tasks]
          Name: "desktopicon"; Description: "Создать ярлык на рабочем столе"; GroupDescription: "Дополнительные значки:"

          [Icons]
          Name: "{autoprograms}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"
          Name: "{autodesktop}\{#MyAppName}"; Filename: "{app}\{#MyAppExeName}"; Tasks: desktopicon

          [Run]
          Filename: "{app}\{#MyAppExeName}"; Description: "Запустить {#MyAppName}"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content -Path build/installer.iss -Encoding UTF8

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss'

      - name: Create checksums
        shell: pwsh
        run: |
          $file = Get-Item release/PDFMathTranslate_WLL_Setup_v0_3_1.exe
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File release/SHA256SUMS.txt -Encoding ascii

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: PDFMathTranslate_WLL_Windows_v0_3_1
          path: |
            release/PDFMathTranslate_WLL_Setup_v0_3_1.exe
            release/SHA256SUMS.txt
          retention-days: 14
