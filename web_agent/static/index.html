<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="/manifest.webmanifest"><title>AI Developer</title><style>body{margin:0;background:#0b1020;color:#f8fafc;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column}header{padding:20px;font-size:22px;font-weight:700}#chat{flex:1;padding:12px 16px;overflow:auto}.m{padding:12px 14px;border-radius:16px;margin:8px 0;white-space:pre-wrap}.u{background:#2563eb;margin-left:35px}.a{background:#1e293b;margin-right:20px}form{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:#0b1020}textarea{flex:1;resize:none;border:0;border-radius:14px;padding:12px;font:inherit}button{border:0;border-radius:14px;padding:0 18px;background:#22c55e;font-weight:700}</style></head><body><main><header>🤖 AI Developer</header><section id="chat"></section><form><textarea id="msg" rows="2" placeholder="Дай задание агенту..."></textarea><button>➤</button></form></main><script>const chat=document.querySelector('#chat'),msg=document.querySelector('#msg');function add(t,c){let d=document.createElement('div');d.className='m '+c;d.textContent=t;chat.append(d);chat.scrollTop=chat.scrollHeight}document.querySelector('form').onsubmit=async e=>{e.preventDefault();let text=msg.value.trim();if(!text)return;msg.value='';add(text,'u');add('Думаю...','a');let last=chat.lastChild;try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});let x=await r.json();last.textContent=x.answer||x.error||'Ошибка'}catch(e){last.textContent='Не удалось подключиться к агенту.'}};</script></body></html>
